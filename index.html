<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pokédex completa con búsqueda, filtros por tipo y generación, detalle de cada Pokémon con estadísticas, evolución, movimientos y más.">
  <meta name="theme-color" content="#0f0f1a">
  <meta name="color-scheme" content="dark light">
  <title>Pokédex — Todos los Personajes</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚡%3C/text%3E%3C/svg%3E">
</head>
<body>
  <button id="themeToggle" class="theme-toggle" aria-label="Cambiar tema" title="Cambiar tema">
    <span class="theme-icon theme-icon-sun">☀️</span>
    <span class="theme-icon theme-icon-moon">🌙</span>
  </button>

  <header class="hero-header">
    <div class="header-content">
      <h1>⚡ Pokédex Completa</h1>
      <p class="subtitle">Todos los personajes de Pokémon — búsqueda, filtros y detalle</p>
    </div>
  </header>

  <main class="container">
    <div class="filters-bar">
      <div class="filter-group">
        <span class="filter-label">🔥 Tipos:</span>
        <div id="typeFilters" class="type-filters"></div>
      </div>
      <div class="filter-group">
        <span class="filter-label">🌍 Generación:</span>
        <select id="generationFilter" class="filter-select">
          <option value="all">Todas</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-label">📊 Ordenar:</span>
        <select id="sortFilter" class="filter-select">
          <option value="number">Número</option>
          <option value="name">Nombre</option>
          <option value="stat-total">Total de Stats</option>
        </select>
      </div>
      <button id="clearFiltersBtn" class="clear-btn" title="Limpiar todos los filtros">✕ Limpiar</button>
    </div>

    <div class="search-bar">
      <div class="search-input-wrapper">
        <input
          type="text"
          id="searchInput"
          placeholder="🔍  Buscar Pokémon por nombre o número (#025)..."
          autocomplete="off"
          aria-label="Buscar Pokémon"
        >
        <div id="searchAutocomplete" class="search-autocomplete"></div>
      </div>
      <span id="countBadge" class="count-badge">Cargando...</span>
    </div>

    <div id="pokemonGrid" class="pokemon-grid"></div>

    <div id="skeletonGrid" class="pokemon-grid skeleton-grid hidden"></div>

    <div id="loadMoreContainer" class="load-more-container hidden">
      <button id="loadMoreBtn" class="load-more-btn">
        <span>Cargar más Pokémon</span>
        <span class="load-more-icon">↓</span>
      </button>
    </div>

    <div id="loading" class="loading-overlay">
      <div class="spinner"></div>
      <p class="loading-text">Cargando Pokédex...</p>
    </div>
  </main>

  <footer class="footer">
    <p>Hecho con ❤️ usando <a href="https://pokeapi.co/" target="_blank" rel="noopener">PokeAPI</a></p>
    <p class="footer-right">
      <a href="https://dicumurray.github.io/pokedex/" target="_blank" rel="noopener">🌐 Ver en línea</a>
      ·
      <a href="detail.html?id=25">🌟 Ejemplo: Pikachu</a>
    </p>
  </footer>

  <script src="js/script.js?v=8fbcf9e"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => {
          console.log('SW registrado:', reg.scope);
        }).catch(err => console.error('SW error:', err));
      });
    }
  </script>
</body>
</html>
